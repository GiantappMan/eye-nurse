<!doctype html>
<!-- 日落时钟 · 锁屏表面（ESP-1 示例）：全屏日落渐变 + 大钟 + 休息倒计时。
     密码框与右下解锁按钮由宿主独占渲染（manifest chrome 声明摆放位置，
     皮肤读不到密码）——本页只在视觉上留出对应空间。
     未锁定时点击任意处 = 结束休息；已锁定时必须经宿主密码框输入。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        color: #ffe8d1;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, #150a1e 0%, #3d1436 38%, #7a2c4e 68%, #c8542f 100%);
      }
      .sun {
        position: absolute;
        left: 50%;
        top: 30%;
        width: 220px;
        height: 220px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #ffd23c 0%, #ff8a3c 55%, rgb(255 138 60 / 0) 72%);
        opacity: 0.9;
      }
      .haze {
        position: absolute;
        left: 0;
        right: 0;
        top: 30%;
        height: 6px;
        background: rgb(21 10 30 / 0.55);
        box-shadow: 0 14px 0 rgb(21 10 30 / 0.45), 0 30px 0 rgb(21 10 30 / 0.35);
      }
      .stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 40%;
        text-align: center;
      }
      #clock {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 92px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 4px;
        text-shadow: 0 4px 24px rgb(21 10 30 / 0.6);
      }
      #date {
        margin-top: 10px;
        font-size: 16px;
        opacity: 0.75;
      }
      #rest {
        margin-top: 34px;
        font-size: 22px;
        letter-spacing: 2px;
      }
      #rest b {
        font-family: Consolas, monospace;
        font-size: 34px;
        font-variant-numeric: tabular-nums;
      }
      #hint {
        position: absolute;
        left: 50%;
        top: 76%;
        transform: translateX(-50%);
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="sun"></div>
    <div class="haze"></div>
    <div class="stack">
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="rest" hidden>休息一下 · <b id="countdown">00:00</b></div>
    </div>
    <div id="hint"></div>
    <script src="/eyenurse-api.js"></script>
    <script>
      (function () {
        "use strict";
        var clockEl = document.getElementById("clock");
        var dateEl = document.getElementById("date");
        var restEl = document.getElementById("rest");
        var countdownEl = document.getElementById("countdown");
        var hintEl = document.getElementById("hint");
        var texts = {};

        function two(n) { return String(n).padStart(2, "0"); }
        function fmt(totalMs) {
          var s = Math.max(0, Math.floor(totalMs / 1000));
          return two(Math.floor(s / 60) % 60) + ":" + two(s % 60);
        }

        function renderClock() {
          var now = new Date();
          clockEl.textContent = two(now.getHours()) + ":" + two(now.getMinutes());
          dateEl.textContent = now.toLocaleDateString();
        }
        setInterval(renderClock, 1000);
        renderClock();

        eyenurse.onTexts(function (t) {
          texts = t;
          hintEl.textContent = t.lockUnlockPlaceholder || "";
        });

        eyenurse.onState(function (s) {
          restEl.hidden = !s.resting;
          countdownEl.textContent = fmt(s.remainingMs);
          // 未锁 = 点击任意处结束休息；已锁 = 只能走宿主密码框
          document.body.style.cursor = s.locked ? "default" : "pointer";
          hintEl.textContent = s.locked
            ? texts.lockUnlockPlaceholder || ""
            : texts.resting || "";
        });

        document.body.addEventListener("click", function () {
          eyenurse.endRest(); // 已锁定时宿主会忽略（endRest 只在未锁生效）
        });
      })();
    </script>
  </body>
</html>
