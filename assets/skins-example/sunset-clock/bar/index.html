<!doctype html>
<!-- 日落时钟 · 悬浮条表面（ESP-1 示例）：胶囊条 + 大号 mm:ss + 底部进度线。
     拖动 = mousedown 调 eyenurse.drag()（系统级，宿主接手移动与落盘）；
     ⚙ 按钮 = 设置；置顶 ⬆ = eyenurse.setTopmost 切换。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #pill {
        position: relative;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 12px;
        border-radius: 15px;
        background: linear-gradient(160deg, #2b1533 0%, #7a2c4e 55%, #c8542f 100%);
        box-shadow: 0 2px 10px rgb(20 8 4 / 0.45);
        cursor: grab;
      }
      #pill:active {
        cursor: grabbing;
      }
      #time {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #ffe8d1;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.35);
      }
      #time.warn {
        color: #ffd23c;
      }
      .btn {
        border: none;
        background: rgb(255 232 209 / 0.14);
        color: #ffe8d1;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        font-size: 11px;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .btn:hover {
        background: rgb(255 232 209 / 0.3);
      }
      .btn.on {
        background: #ff8a3c;
        color: #2b1533;
      }
      #progress {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 3px;
        height: 2px;
        border-radius: 1px;
        background: rgb(255 232 209 / 0.18);
      }
      #fill {
        height: 100%;
        width: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #ffd23c, #ff8a3c);
        transition: width 1s linear;
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <span id="time">00:00</span>
      <button id="top" class="btn" title="置顶">⬆</button>
      <button id="cfg" class="btn" title="设置">⚙</button>
      <div id="progress"><div id="fill"></div></div>
    </div>
    <script src="/eyenurse-api.js"></script>
    <script>
      (function () {
        "use strict";
        var timeEl = document.getElementById("time");
        var fillEl = document.getElementById("fill");
        var topBtn = document.getElementById("top");
        var topmost = false;

        function fmt(totalMs) {
          var s = Math.max(0, Math.floor(totalMs / 1000));
          var m = Math.floor(s / 60) % 60;
          var ss = s % 60;
          var two = function (n) { return String(n).padStart(2, "0"); };
          return two(m) + ":" + two(ss);
        }

        eyenurse.onState(function (s) {
          if (s.resting) {
            timeEl.textContent = "☕";
            fillEl.style.width = "100%";
            return;
          }
          timeEl.textContent = fmt(s.countdownMs);
          timeEl.classList.toggle("warn", s.countdownMs < 5 * 60 * 1000);
          var ratio = Math.min(Math.max(s.countdownMs / Math.max(s.intervalMs, 1), 0), 1);
          fillEl.style.width = (ratio * 100).toFixed(1) + "%";
          topmost = !!s.topmost;
          topBtn.classList.toggle("on", topmost);
        });

        // 拖动：条身按下即交系统拖动（宿主处理移动/边界/落盘）
        document.getElementById("pill").addEventListener("mousedown", function (ev) {
          if (ev.target.classList.contains("btn")) return; // 按钮不触发拖动
          eyenurse.drag();
        });
        document.getElementById("cfg").addEventListener("click", function () {
          eyenurse.openSettings();
        });
        topBtn.addEventListener("click", function () {
          eyenurse.setTopmost(!topmost);
        });
      })();
    </script>
  </body>
</html>
