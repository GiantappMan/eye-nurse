<!doctype html>
<!-- classic 内置皮肤 · 锁屏表面（ESP-1 headless）：原 mask 壳页内置界面的皮肤化
     迁移——视觉与 v3.2 之前完全一致（旋转圈 + mm:ss 倒计时 + 锁屏时钟面板）。
     与第三方皮肤同管线：sandbox iframe 加载、状态/文案/配色全走 eyenurse 桥。
     密码框与右下解锁按钮是宿主独占 chrome（不归本皮肤渲染）；配色经
     eyenurse-colors 推送（night/sakura 等纯配色皮肤 = 本皮肤 + 换色）。
     mm:ss 公式复刻 B2/Q13：mm 为分钟分量（>59min 回绕）。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        /* 兜底 = theme.json classic 值；eyenurse-colors 到达后被覆盖 */
        --eyenurse-mask-bg: #141418;
        --eyenurse-mask-fg: #eeeef2;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--eyenurse-mask-bg);
        color: var(--eyenurse-mask-fg);
        user-select: none;
      }
      #mask {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .center-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      /* 70×70 CSS 旋转加载圈 + 叠放其上的 mm:ss（C3/C4） */
      .spinner-stack {
        position: relative;
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        position: absolute;
        inset: 0;
        border: 4px solid transparent;
        border-top-color: var(--eyenurse-mask-fg);
        border-right-color: var(--eyenurse-mask-fg);
        border-radius: 50%;
        animation: spin 1.2s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #countdown {
        font-family: Consolas, monospace;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      #lock-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #lock-panel[hidden] {
        display: none;
      }
      #locked-title {
        margin: 0;
        font-size: 14px;
        letter-spacing: 2px;
        opacity: 0.65;
      }
      #clock {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 64px;
        line-height: 1.1;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #lock-date {
        font-size: 14px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="mask">
      <div class="center-stack">
        <div class="spinner-stack" id="spinner-stack">
          <div class="spinner"></div>
          <div id="countdown">00:00</div>
        </div>
        <div id="lock-panel" hidden>
          <p id="locked-title"></p>
          <div id="clock">--:--</div>
          <div id="lock-date"></div>
        </div>
      </div>
    </div>
    <script src="/eyenurse-api.js"></script>
    <script>
      (function () {
        "use strict";
        var spinnerStack = document.getElementById("spinner-stack");
        var countdownEl = document.getElementById("countdown");
        var lockPanel = document.getElementById("lock-panel");
        var lockedTitle = document.getElementById("locked-title");
        var clockEl = document.getElementById("clock");
        var lockDateEl = document.getElementById("lock-date");
        var texts = {};

        function applyColors(colors) {
          if (colors.mask_bg) {
            document.documentElement.style.setProperty("--eyenurse-mask-bg", colors.mask_bg);
          }
          if (colors.mask_fg) {
            document.documentElement.style.setProperty("--eyenurse-mask-fg", colors.mask_fg);
          }
        }

        function applyTexts(t) {
          texts = t || {};
          lockedTitle.textContent = texts["lockedTitle"] ?? "lockedTitle";
        }

        function two(n) {
          return String(n).padStart(2, "0");
        }
        function fmt(totalMs) {
          var s = Math.max(0, Math.floor(totalMs / 1000));
          return two(Math.floor(s / 60) % 60) + ":" + two(s % 60); // B2/Q13 分钟分量回绕
        }

        eyenurse.onColors(applyColors);
        eyenurse.onTexts(applyTexts);
        eyenurse.onState(function (s) {
          countdownEl.textContent = fmt(s.remainingMs);
          spinnerStack.style.display = s.resting ? "" : "none";
          lockPanel.hidden = !s.locked;
        });

        // 锁屏时钟：本地时间 HH:MM + 日期（1s 刷新；仅 locked 可见）
        function renderClock() {
          var now = new Date();
          clockEl.textContent = two(now.getHours()) + ":" + two(now.getMinutes());
          lockDateEl.textContent = now.toLocaleDateString();
        }
        setInterval(renderClock, 1000);
        renderClock();
      })();
    </script>
  </body>
</html>
