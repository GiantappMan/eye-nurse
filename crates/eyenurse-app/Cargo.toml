[package]
name = "eyenurse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "eyenurse"
path = "src/main.rs"

[features]
# tauri build 时由 CLI 传入；普通 cargo check/test 不启用（无需 ui/dist 即可编译，
# 架构文档 §1.3：dev 流程由 CLI 以 `cargo run --no-default-features` 驱动）
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
eyenurse-core = { path = "../eyenurse-core" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
sys-locale = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
windows = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
serde_json = { workspace = true } # build.rs 消费 theme.json（配色真源校验 + 代码生成）
