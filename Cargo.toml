[workspace]
resolver = "2"
members = ["crates/eyenurse-core", "crates/eyenurse-app"]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.95"        # 当前工具链基线；tauri 2 MSRV 低于此值

[workspace.dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
sys-locale = "0.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", # TrackMouseEvent/TRACKMOUSEEVENT（bar 复选悬停浮现，§6.2）
    "Win32_UI_HiDpi",               # GetDpiForWindow / GetDpiForMonitor（bar 逻辑/物理换算，§6.1）
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",       # CreateMutexW 单实例（参数类型在 Win32_Security）
    "Win32_Security",               # SECURITY_ATTRIBUTES：CreateMutexW 签名依赖
    "Win32_UI_Shell",               # SHGetKnownFolderPath / ShellExecuteW
    "Win32_System_Com",             # CoTaskMemFree：释放 SHGetKnownFolderPath 返回的 PWSTR
] }

[profile.release]
lto = "thin"
strip = true

# dev 下依赖（tauri/wry/WebView2 相关）用 O2，业务代码保持 O0 快速增量编译：
# 界面不卡，改代码后的重编译仍然只发生在本 crate
[profile.dev.package."*"]
opt-level = 2
