[workspace]
resolver = "2"
members = ["crates/eyenurse-core", "crates/eyenurse-app"]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.95"        # eframe 0.36.2 要求

[workspace.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36.2"                  # 直接依赖（eframe::egui 同版本 re-export；UI 模块直接 use egui::）
tray-icon = "0.26.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
sys-locale = "0.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",       # CreateMutexW 单实例（参数类型在 Win32_Security）
    "Win32_Security",               # SECURITY_ATTRIBUTES：CreateMutexW 签名依赖
    "Win32_UI_Shell",               # SHGetKnownFolderPath / ShellExecuteW
    "Win32_System_Com",             # CoTaskMemFree：释放 SHGetKnownFolderPath 返回的 PWSTR
] }

[profile.release]
lto = "thin"
strip = true
