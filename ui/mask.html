<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LockScreenWindow</title>
  </head>
  <body>
    <!-- 休息/锁屏遮罩壳页（ESP-1 headless）：本页**没有任何内置界面**——锁屏
         与休息画面全部由皮肤提供（core 保证 lock URL 恒有：激活皮肤无 lock
         表面时回退内置 classic 包）。壳页只保留两类宿主独占元素：
         - #skin-frame：sandbox iframe 承载皮肤页（skinHost 桥 + 握手看门狗）；
         - chrome（#skin-pwd-row/#skin-lock-err/#unlock）：密码框、错误提示与
           解锁逃生按钮——皮肤 iframe 不可达，密码永不过 iframe，防爆破限速在
           CoreLoop。解锁按钮恒在 = 任何皮肤损坏时用户都有逃生口。 -->
    <div id="mask">
      <iframe id="skin-frame" sandbox="allow-scripts" title="skin"></iframe>
      <div id="skin-pwd-row" hidden>
        <input id="skin-pwd" type="password" autocomplete="off" spellcheck="false" />
      </div>
      <p id="skin-lock-err" hidden></p>
      <button id="unlock">
        <!-- 图标 24px 1:1 渲染，尺寸唯一由 mask.css #unlock svg 定义 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 7.9-.8" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/mask/main.ts"></script>
  </body>
</html>
